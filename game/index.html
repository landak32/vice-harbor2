<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vice Harbor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070d; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  #game {
    position: fixed; inset: 0; width: 100%; height: 100%; display: block;
    background: #05070d; touch-action: none; cursor: none; outline: none;
  }
  /* Read aloud by screen readers, never shown on the canvas. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Vice Harbor: a top-down open-world crime game. Walk the city, steal a car, take jobs from the crew, and outrun the Harbor Police."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
